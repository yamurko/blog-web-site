spring:
  application:
    name: blog-backend
  profiles:
    # Sırları tutan application-local.yml (gitignore'lı) yüklenir.
    # Bu dosya yoksa uygulama başlamaz — bkz. AGENTS.md "Güvenli Yapılandırma".
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/blog-web-site
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

app:
  jwt:
    # Değer application-local.yml veya ortam değişkeni JWT_SECRET'dan gelir.
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
